# Thunderstore Mod Manager - Keyboard Shortcuts

[global]
Ctrl+N = New profile
Ctrl+S = Save profile
Ctrl+O = Open profile
Ctrl+D = Delete profile
Ctrl+Q = Quit

[mods]
Enter = Install selected mod
Delete = Uninstall selected mod
Ctrl+E = Enable/disable selected mod
Ctrl+U = Check for mod updates
Ctrl+F = Focus search box

[games]
Ctrl+L = Launch game with current profile
Ctrl+Shift+L = Launch game without mods

[view]
F5 = Refresh mod list
Ctrl+T = Toggle theme
