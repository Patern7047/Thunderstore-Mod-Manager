// Thunderstore Mod Manager - Build configuration
// Project: Thunderstore Mod Manager
// Framework: .NET 8.0 (Windows Forms)

[project]
name = "ThunderstoreModManager"
version = "3.2.18"
target_framework = "net8.0-windows"
runtime = "win-x64"
output_type = "WinExe"

[build]
self_contained = true
single_file = true
ready_to_run = true
trim_unused = false

[publish]
command = "dotnet publish -c Release -r win-x64 --self-contained true"
output = "bin/Release/net8.0-windows/win-x64/publish/"

[package]
archive = "ThunderstoreModManager.zip"
include = ["config", "resources", "docs"]
